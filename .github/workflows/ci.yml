name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Hash-pinned: pip refuses anything that doesn't match requirements-dev.lock
      - run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: ruff check .
      - run: pytest -q
      - name: Static security analysis (bandit)
        run: bandit -q -r src -ll
      - name: Known-vulnerability audit of pinned dependencies
        run: pip-audit --require-hashes -r requirements.lock --strict
