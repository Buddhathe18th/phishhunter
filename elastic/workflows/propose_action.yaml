# Import in Kibana: Workflows -> Create -> paste. Then expose it to the agent as a tool:
#   python -m src.setup_elastic --workflow-id <id shown in Kibana>
# The workflow only *records a proposal*. doppel's policy gate (src/actions.py) decides whether it runs
# unattended (needs AUTO_ACTIONS=1 plus corroborating evidence) or waits for a person in the dashboard.
version: "1"
name: doppel_propose_action
description: Record a proposed action (block_domain, notify, file_report) for a suspected phishing domain.
enabled: true
triggers:
  - type: manual
inputs:
  - name: domain
    type: string
  - name: kind
    type: string
    default: notify
  - name: rationale
    type: string
steps:
  - name: record_proposal
    type: elasticsearch.index
    with:
      index: phish-actions
      document:
        domain: "{{ inputs.domain }}"
        kind: "{{ inputs.kind }}"
        status: proposed
        source: agent-builder
        rationale: "{{ inputs.rationale }}"
